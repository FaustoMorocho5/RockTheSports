<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inisio de sesion - TheRockSports</title>
    <link rel="stylesheet" href="../CSS/rockthesport.css">
</head>

<body>
   <main class="contenedor-principal">
        <section class="inicio-sesion">
            <div class="formulario-inicio-sesion">
                <form action="ESQUELETO_PAGWEB1.html" method="POST">
                    <h2>Iniciar sesión</h2>

                    <div class="campo-form">
                        <label for="usuario">Correo electrónico</label>
                        <input type="email" name="usuario" id="usuario" placeholder="ejemplo@ejemplo.es" required>
                    </div>

                    <div class="campo-form">
                        <label for="contrasena">Contraseña</label>
                        <input type="password" name="contrasena" id="contrasena" placeholder="Contraseña" required>
                    </div>

                    <button type="submit" class="btn-enviar">Iniciar sesión</button>

                    <div class="enlaces-formulario">
                        <!-- <a href="recuperarContrasena.html">¿Has olvidado tu contraseña?</a> -->
                        <a href="formularioRegistroDeportista.html">Crear una cuenta</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
