<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <aside>
        <a href="#perfil">Mi perfil</a> <br>
        <a href="#inscripciones">Inscripciones</a><br>
        <a href="">Favoritos</a>
    </aside>

    <main>
        <section class="perfil" id="perfil">
            <h1>Bienvenido .......</h1>
            <div class="infoperfil">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required><br>
                <label for="usuario">Correo electronico</label>
                <input type="email" name="usuario" id="usuario" placeholder="ejemplo@ejemplo.es" required><br>

                <label for="fechanacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechanacimiento" name="fechanacimiento" required><br>
                <label for="dni">DNI</label>
                <input type="text" id="dni" name="dni"><br>
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" maxlength="20"><br>
                <label for="sexo">Sexo</label>
                <input type="text" id="sexo" name="sexo"><br>
                <label for="contrasena">Contraseña</label>
                <input type="password" name="contrasena" id="contrasena" required placeholder="contraseña"><br>
                <a href="">Modificar datos</a>
            </div>

        </section>
        <section class="inscripciones" id="inscripciones">
            <h1>Mis inscripciones</h1>

        </section>
        <section class="favoritos" id="favoritos">
            <h1>Favoritos</h1>
        </section>
    </main>
</body>

</html>
